name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
      - name: Build desktop executable
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name AdwaaERP --add-data "templates;templates" --add-data "static;static" --collect-all webview desktop.py
      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AdwaaERP-Windows-Setup
          path: installer_output/AdwaaERP_Setup.exe
          if-no-files-found: error
